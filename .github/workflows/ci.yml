name: PrecedentOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q contracts precedentos_protocol scripts
      - run: python -m pytest -q tests
      - name: GenVM static checks
        run: |
          genvm-lint check contracts/precedent_registry.py
          genvm-lint check contracts/precedent_evaluator.py
          genvm-lint check contracts/case_court.py
          genvm-lint schema contracts/precedent_registry.py
          genvm-lint schema contracts/precedent_evaluator.py
          genvm-lint schema contracts/case_court.py
          genvm-lint typecheck contracts/precedent_registry.py
          genvm-lint typecheck contracts/precedent_evaluator.py
          genvm-lint typecheck contracts/case_court.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  windows-portability:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q contracts precedentos_protocol scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
